[package]
name = "mock-sector"
version = "0.1.0"
edition = "2021"
publish = false
description = "TEST SCAFFOLDING ONLY: a deliberately tiny and insecure mock sector program for the core-vault devnet rehearsal. Never deploy to mainnet."

[lib]
name = "mock_sector"
crate-type = ["cdylib", "lib"]

[features]
# Link the library without the program entrypoint (used by the tests to build instructions).
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "=2.3.0"
# the borsh the shared-interfaces crate uses (0.10)
borsh = "=0.10.4"
solana-system-interface = { version = "=1.0.0", features = ["bincode"] }
setl8-shared-interfaces = { git = "https://github.com/rovik9/setl8-turbo", tag = "v0.4.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
