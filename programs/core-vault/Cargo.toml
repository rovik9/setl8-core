[package]
name = "core-vault"
version = "0.1.0"
description = "Setl8 core vault program — payout vault + bond vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "core_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.32.1"

# Pinned to the v0.2.0 tag, not a floating branch, so a shape change on the
# shared-interfaces side (new instruction, changed discriminator/account
# layout) never silently breaks this program on a fresh `cargo build` — a
# bump only happens when someone deliberately moves the tag pin below.
setl8-shared-interfaces = { git = "https://github.com/rovik9/setl8-turbo", tag = "v0.2.0" }
