[package]
name = "core-vault"
version = "0.1.0"
description = "Setl8 core vault program — payout vault + bond vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "core_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
# Forwarded to setl8-shared-interfaces so its `ChallengeSize` gets a real
# `anchor_lang::IdlBuild` impl during `anchor build`'s IDL-generation pass.
# That crate has zero anchor-lang dependency otherwise, by design (see its
# Cargo.toml) — this feature is the only place that changes.
# anchor-spl 0.32.1's own idl-build module unconditionally names
# `token_interface`, which only exists with its `token_2022` feature. Enabling
# that feature HERE (IDL generation only) keeps the on-chain program on the
# classic `token` feature alone: Token-2022 code is never linked into the .so.
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "anchor-spl/token_2022",
    "setl8-shared-interfaces/idl-build",
]
default = []

[dependencies]
anchor-lang = "0.32.1"
# Classic SPL Token only (Token-2022 is rejected by design); `token` feature only.
anchor-spl = { version = "0.32.1", default-features = false, features = ["token"] }

# Pinned to a release tag, not a floating branch, so a shape change on the
# shared-interfaces side (new instruction, changed discriminator/account
# layout) never silently breaks this program on a fresh `cargo build` — a
# bump only happens when someone deliberately moves the tag pin below.
# v0.3.0 adds record_activity / mark_abandoned / deposit_reset /
# pause_product, the Activity/Payout outcome enums, reset_price_bps on
# register/update, and trader_wallet + account_size on DepositFeeArgs.
# (idl-build was added in v0.2.1.) v0.3.1 fixes the register_product builder
# (sl8_admin is writable: it pays the registry rent).
setl8-shared-interfaces = { git = "https://github.com/rovik9/setl8-turbo", tag = "v0.3.1" }
